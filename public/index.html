<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A3F2E">
  <meta name="description" content="Madani Channel staff messenger: chats, groups and department channels on phone and computer.">
  <title>Madani Messenger</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    try { const t = localStorage.getItem('mm.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div id="boot" class="boot"><span class="logo">MC</span></div>
  <div id="auth" class="auth" hidden></div>

  <div id="app" class="app" data-pane="list" hidden>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <section id="listPane" class="pane list-pane" aria-label="Conversations"></section>
    <section id="convPane" class="pane conv-pane" aria-label="Conversation"></section>
    <section id="threadPane" class="pane thread-pane" aria-label="Thread" hidden></section>
  </div>

  <div id="overlay"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/vendor/qrcode.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
